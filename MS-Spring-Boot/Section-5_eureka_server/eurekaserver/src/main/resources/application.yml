server:
  port: 8070

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: eurekaserver
  config:
    import: "configserver:http://localhost:8071/"
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka
#  server:
#    enable-self-preservation: false  # optional: disable self-preservation for dev
#    eviction-interval-timer-in-ms: 5000  # heartbeat eviction interval
management:
  endpoints:
    web:
      exposure:
        include: "*"   # Expose all actuator endpoints
  endpoint:
    health:
      probes:
        enabled: true   # Enable /liveness and /readiness
  health:
    liveness-state:
      enabled: true
    readiness-state:
      enabled: true
