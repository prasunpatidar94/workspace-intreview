server:
  port: 8081
spring:
  profiles:
    active: "local"
  application:
    name: "loans"
  config:
    import: "optional:configserver:http://localhost:8071/"
  rabbitmq:
    host: localhost
    password: "guest"
    username: "guest"
    port: 9000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always            # Options: always, embedded, never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false


management:
  endpoints:
    web:
      exposure:
        include: "*"
build:
  version: "1.0 V"

loans:
  massage: "Welcome In SunBank  Loans Application ...!"
  contactDetails:
    name: "Prasun Patidar"
    email: "codebysun@gmail.com"
  onCallSupport:
    - 10101-00000
    - 99999-00000
