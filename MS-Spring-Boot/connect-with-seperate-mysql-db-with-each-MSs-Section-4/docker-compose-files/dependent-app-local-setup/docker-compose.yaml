version: "3.9"

services:

  accounts-db:
    image: mysql:8.0
    container_name: accounts-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: accounts_db
      MYSQL_USER: accounts
      MYSQL_PASSWORD: accounts
    volumes:
      - accounts_data:/var/lib/mysql
    restart: always

  loans-db:
    image: mysql:8.0
    container_name: loans-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loans_db
      MYSQL_USER: loans
      MYSQL_PASSWORD: loans
    volumes:
      - loans_data:/var/lib/mysql
    restart: always

  cards-db:
    image: mysql:8.0
    container_name: cards-db
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cards_db
      MYSQL_USER: cards
      MYSQL_PASSWORD: cards
    volumes:
      - cards_data:/var/lib/mysql
    restart: always

volumes:
  accounts_data:
  loans_data:
  cards_data:
