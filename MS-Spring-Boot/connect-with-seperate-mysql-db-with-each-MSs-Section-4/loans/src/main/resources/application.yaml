server:
  port: 8081
spring:
  profiles:
    active: default
  application:
    name: "loans"

  datasource:
    url: jdbc:mysql://localhost:3307/loans_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: loans
    password: loans
    driver-class-name: com.mysql.cj.jdbc.Driver

  config:
    import: "configserver:http://localhost:8071/"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always            # Options: always, embedded, never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
build:
  version: "1.0 V"

loans:
  massage: "Welcome In SunBank  Loans Application ... Local!"
  contactDetails:
    name: "Prasun Patidar"
    email: "codebysun@gmail.com"
  onCallSupport:
    - 10101-00000
    - 99999-00000
