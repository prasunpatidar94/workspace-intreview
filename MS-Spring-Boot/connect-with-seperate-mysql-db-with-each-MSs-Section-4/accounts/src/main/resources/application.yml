server:
  port: 8080
spring:
  profiles:
    active: default
  application:
    name: "accounts"

  datasource:
    url: jdbc:mysql://localhost:3306/accounts_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: accounts
    password: accounts
    driver-class-name: com.mysql.cj.jdbc.Driver

  config:
    import: "configserver:http://localhost:8071/"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always            # Options: always, embedded, never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
build:
  version: "1.0 V"

accounts:
  massage: "Welcome In SunBank Accounts Application..!"
  contactDetails:
    name: "Prasun Patidar"
    email: "codebysun@gmail.com"
  onCallSupport:
    - 88888-88888
    - 99999-99999
