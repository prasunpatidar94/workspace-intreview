server:
  port: 8080
spring:
  profiles:
    active: abc
  application:
    name: accounts

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always            # Options: always, embedded, never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false


management:
  endpoints:
    web:
      exposure:
        include: "*"
build:
  version: "1.0 V"

accounts:
  massage: "Welcome In SunBank Accounts Application..!"
